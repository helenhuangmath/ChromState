[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chromstate"
version = "1.1.0"
description = "Quantitative chromatin state analysis: soft state composition, bivalency scoring, mark attribution, and state dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hua Huang" }]
keywords = ["epigenomics", "chromatin", "ChIP-seq", "CUT&RUN", "ATAC-seq", "HMM"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "matplotlib>=3.5",
  "scikit-learn>=1.0",
]

[project.optional-dependencies]
bam = ["pysam>=0.19"]
bigwig = ["pyBigWig>=0.3"]
anndata = ["anndata>=0.8"]
fast = ["numba>=0.56"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]
docs = ["sphinx>=7", "myst-parser>=2", "sphinx-rtd-theme>=2"]
all = ["pysam>=0.19", "pyBigWig>=0.3", "anndata>=0.8", "numba>=0.56"]

[project.urls]
Homepage = "https://github.com/helenhuangmath/ChromState"
Documentation = "https://helenhuangmath.github.io/ChromState/"
Issues = "https://github.com/helenhuangmath/ChromState/issues"
Changelog = "https://github.com/helenhuangmath/ChromState/blob/main/CHANGELOG.md"

[project.scripts]
chromstate = "chromstate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chromstate"]

[tool.hatch.build.targets.sdist]
# source, tests and the text documentation; figures and analysis outputs stay in the repository
include = ["src", "tests", "tools", "docs/source", "docs/tutorials", "docs/*.md",
           "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "environment.yml",
           "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ so the package is importable without installing it; tools/ for the external-tool
# comparison harness, which is a repo-local script folder rather than part of the wheel.
pythonpath = ["src", "tools"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",
  # The project supports Python 3.9, so keep legacy typing imports/annotations
  # instead of requiring pyupgrade's Python 3.10+ spelling everywhere.
  "UP",
]
