# conda env create -f environment.yml && conda activate chromstate
name: chromstate
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.21
  - scipy>=1.7
  - pandas>=1.3
  - matplotlib>=3.5
  - scikit-learn>=1.0
  - numba>=0.56
  - pysam>=0.19
  - pybigwig>=0.3
  - anndata>=0.8
  - pip
  - pip:
      - -e .
